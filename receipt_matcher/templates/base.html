<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}受領照合{% endblock %} - 受領照合</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
<header class="top">
  <a class="name" href="/">受領照合</a>
  <span class="badge">ローカル専用 ・ 外部通信なし</span>
  <span class="where">データ保存先:このPC内</span>
</header>
<div class="body">
<nav class="nav" aria-label="メインメニュー">
  <div class="grp">照合業務</div>
  <a href="/" class="{{ 'on' if nav == 'list' }}">照合一覧</a>
  <a href="/new" class="{{ 'on' if nav == 'new' }}">新規照合</a>
  <div class="grp">マスタ</div>
  <a href="/ledger" class="{{ 'on' if nav == 'ledger' }}">販売台帳</a>
  <a href="/layouts" class="{{ 'on' if nav == 'layouts' }}">受領レイアウト・得意先割当</a>
</nav>
<main class="main">
{% if msg %}<div class="msg msg-ok" role="status">{{ msg }}</div>{% endif %}
{% if err %}<div class="msg msg-err" role="alert">{{ err }}</div>{% endif %}
{% block main %}{% endblock %}
</main>
</div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
