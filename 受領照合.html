<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 外部への通信・外部ファイルの読込をすべて禁止(このファイルの中だけで動作) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>受領照合</title>
<style>
/* 受領照合 デザイン(白サイドメニュー+紫グラデーション・角丸カード) 外部フォント・CDN不使用 */
:root{
  --bg:#ECEEFB;--surface:#FFFFFF;--text:#25233A;--muted:#6E6A82;--line:#E4DEF7;--line2:#EEEAF8;
  --primary:#7B5CF0;--primary2:#9A74F5;--primary-d:#5B3FD6;--primary-l:#F1EDFF;--grad:linear-gradient(135deg,#7B5CF0,#9A74F5);
  --shadow:0 7px 25px rgba(81,66,140,.08);
  --ok-bg:#E3F5EA;--ok:#1B6236;--diff-bg:#FFF1C2;--diff:#6B4A00;--s-bg:#DDEBFF;--s:#1D4C88;--r-bg:#FDE3E6;--r:#A0213A;
  --neg:#C0262D;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Meiryo,'メイリオ','Yu Gothic UI','Hiragino Sans',sans-serif;font-size:14px}
a{color:var(--primary-d)}a:hover{color:var(--primary)}
.app{display:flex;min-height:100vh}
/* サイドメニュー */
.side{width:250px;flex:0 0 250px;background:#fff;padding:24px 18px;box-shadow:4px 0 20px rgba(77,60,160,.07);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{color:var(--primary);font-weight:700;font-size:20px;margin:4px 10px 24px;text-decoration:none;display:block}
.brand:hover{color:var(--primary)}
.nav{display:flex;flex-direction:column}
.nav .grp{font-size:12px;color:#9A96AC;padding:14px 14px 4px;letter-spacing:.04em}.nav .grp:first-child{padding-top:0}
.nav a{display:block;padding:12px 14px;margin:3px 0;border-radius:12px;text-decoration:none;color:#59556C}
.nav a:hover{background:var(--primary-l);color:var(--primary-d)}
.nav a.on{background:var(--grad);color:#fff;box-shadow:0 7px 18px rgba(123,92,240,.24)}
.side-foot{margin-top:auto;padding:16px 10px 0;font-size:12px;color:#8A869D;line-height:1.7}
.side-foot .lock{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--primary-l);color:var(--primary-d);font-weight:700;margin-bottom:6px}
.main{flex:1;min-width:0;padding:30px;display:flex;flex-direction:column;gap:18px}
/* 見出し */
h1{margin:0;font-size:26px;font-weight:700}h2{margin:0;font-size:16px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.head .sub{margin-top:6px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.row .right,.head .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.sub{font-size:13px;color:#7A768C}
.back{font-size:13px;color:var(--primary-d);text-decoration:none}.back:hover{text-decoration:underline}
/* カード */
.card{background:var(--surface);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat .k{font-size:13px;color:#777189}.stat .v{font-size:27px;font-weight:700;margin-top:4px;color:#4A4368}.stat .d{font-size:12px;color:#8A869D}
.stat .v.small{font-size:19px}
.warnv{color:#B26A00 !important}
.wide2{grid-column:span 2}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stepc{padding:14px;border-radius:14px;background:#F5F2FF;border:1px solid #E5DDFF;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:4px}
.stepc:hover{border-color:var(--primary2);color:var(--text)}
.stepc b{color:#6D4CE5}.stepc span{font-size:13px;color:#59556C}
.stepc.done{background:#F2FAF5;border-color:#CDEBD8}.stepc.done b{color:var(--ok)}
.progress{height:8px;background:#E9E4FB;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#7B5CF0,#AF8DFF)}
/* ボタン・入力 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 18px;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;border:1px solid #DDD5FA;background:#fff;color:var(--primary-d);font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--primary-l);color:var(--primary-d)}
.btn-s{height:32px;padding:0 12px;font-size:13px;border-radius:10px}
.btn-p{border:0;background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(123,92,240,.29)}.btn-p:hover{color:#fff;background:linear-gradient(135deg,#6A4BE6,#8C63F0)}
.btn-danger{color:var(--neg);border-color:#F3CDD2}.btn-danger:hover{background:#FFF1F3;color:var(--neg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fld{height:38px;font-size:14px;font-family:inherit;border:1px solid #DDD5FA;border-radius:10px;padding:0 12px;background:#fff;color:var(--text)}
.fld:focus,.cin:focus{outline:2px solid #C9B8FF;outline-offset:0;border-color:var(--primary)}
.fld-s{height:32px;font-size:13px;padding:0 8px;border-radius:8px}
textarea.fld{height:auto;padding:10px 12px;max-width:720px;width:100%}
.lbl{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#777189}
.chk{display:flex;align-items:center;gap:6px;font-size:13px}
input[type=checkbox]{accent-color:var(--primary);width:16px;height:16px}
.filters{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end}
/* 表 */
.tblwrap{overflow-x:auto;border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:#777189;font-weight:700;text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAF9FF;position:sticky;top:0}
.tbl th.gs{color:#3B5CC4;background:#F1F5FF}.tbl th.gr{color:#9A4A16;background:#FFF6EF}.tbl th.gd{color:#6D4CE5;background:#F5F2FF}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl tbody tr:hover td{background:#FBFAFF}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;background:#FAF9FF;border-top:1px solid var(--line)}
.tbl tr.r-diff td{background:#FFFBEA}.tbl tr.r-s td{background:#F3F7FF}.tbl tr.r-r td{background:#FFF5F6}
.tbl tr.used td{background:#F8F5FF}
.tbl .wrap{white-space:normal;min-width:200px}
.tbl.compact{font-size:12.5px}.tbl.compact td,.tbl.compact th{padding:8px 6px}.tbl.compact td.cm{white-space:normal;width:100%;min-width:130px}.tbl.compact td.cm .cin{width:100%;min-width:120px}
.neg{color:var(--neg);font-weight:700}.pos{font-weight:700}.zero{color:#A29EB4}
/* バッジ */
.b{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-diff{background:var(--diff-bg);color:var(--diff)}
.b-s{background:var(--s-bg);color:var(--s)}.b-r{background:var(--r-bg);color:var(--r)}.b-g{background:#EDE8FF;color:#6D4CE5}
.b-std{background:#EDE8FF;color:#6D4CE5}
.big{font-size:15px;padding:6px 16px}
/* タブ */
.panel{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:14px 16px 12px;border-bottom:1px solid var(--line2)}
.tab{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;font-size:14px;text-decoration:none;color:#59556C;border-radius:12px}
.tab:hover{background:var(--primary-l);color:var(--primary-d)}
.tab.on{background:var(--grad);color:#fff;font-weight:700;box-shadow:0 6px 16px rgba(123,92,240,.25)}
.cnt{display:inline-block;min-width:22px;padding:1px 7px;border-radius:99px;font-size:12px;background:#EEEAF8;color:#6E6A82;text-align:center}
.cnt.has{background:#FFE9A8;color:#6B4A00}
.tab.on .cnt{background:rgba(255,255,255,.25);color:#fff}
.panel .bar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;padding:14px 18px}
.panel .inner{overflow-x:auto;padding:0 18px 18px}
.legend{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.cin{height:32px;width:220px;font-size:13px;font-family:inherit;border:1px solid #DDD5FA;border-radius:8px;padding:0 10px}
.cin.saved{border-color:#7BC29A;background:#F4FBF6}.cin.err{border-color:var(--neg)}
/* メッセージ */
.msg{padding:12px 16px;border-radius:12px;font-size:13px}
.msg-ok{background:#EFFAF3;color:var(--ok)}
.msg-err{background:#FFF0F2;color:var(--r)}
.msg-warn{background:#FFF8E5;color:var(--diff)}
.step{display:inline-flex;width:28px;height:28px;border-radius:10px;background:var(--grad);color:#fff;font-size:13px;align-items:center;justify-content:center;margin-right:10px;font-weight:700}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;font-size:13px}.kv>:nth-child(odd){color:#777189}
.info{display:flex;flex-wrap:wrap;gap:28px;background:var(--surface);border-radius:18px;padding:16px 22px;font-size:13px;box-shadow:var(--shadow)}
.info .k{color:#777189;font-size:12px}.info .v{font-weight:700;margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:16px}
.pager{display:flex;gap:8px;align-items:center;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.chip-ok{background:var(--ok-bg);color:var(--ok)}.chip-ng{background:var(--r-bg);color:var(--r)}
.note{margin:0;font-size:12px;color:#8A869D}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
/* 処理中 */
.busy{position:fixed;inset:0;background:rgba(37,35,58,.35);display:flex;align-items:center;justify-content:center;z-index:100}
.busy[hidden]{display:none}
.busy-box{background:#fff;border-radius:18px;padding:24px 32px;display:flex;align-items:center;gap:16px;font-size:15px;box-shadow:0 12px 40px rgba(81,66,140,.25);max-width:90vw}
.spinner{width:28px;height:28px;border:3px solid #E9E4FB;border-top-color:var(--primary);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
/* 画面幅 */
@media (max-width:1100px){.cards,.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:850px){.side{width:190px;flex-basis:190px}}
@media (max-width:600px){.app{display:block}.side{width:auto;height:auto;position:static;padding:14px}.brand{margin:0 6px 10px}.nav{flex-direction:row;overflow:auto;gap:6px}.nav .grp,.side-foot{display:none}.nav a{white-space:nowrap}
  .cards,.steps{grid-template-columns:1fr}.wide2{grid-column:span 1}.main{padding:16px}.grid2{grid-template-columns:1fr}}
/* 調整 */
.wide2 .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1560px){.side{width:220px;flex-basis:220px;padding:22px 14px}.main{padding:24px}
  .tbl.compact td,.tbl.compact th{padding:8px 5px}.tbl.compact td.cm{min-width:110px}.tbl.compact td.cm .cin{min-width:100px}}

/* ファイル選択欄(未選択/セット済みを明確に) */
.dropwrap{display:flex;flex-direction:column;gap:8px;align-items:flex-start;width:100%}
.drop{position:relative;width:100%;display:flex;align-items:center;gap:14px;padding:18px 20px;border:2px dashed #CFC2FA;border-radius:14px;background:#FBFAFF;cursor:pointer;transition:background .15s,border-color .15s}
.drop:hover{border-color:var(--primary2);background:#F7F4FF}
.drop:focus-within{outline:3px solid #C9B8FF;outline-offset:2px}
.drop.over{border-color:var(--primary);border-style:solid;background:var(--primary-l)}
.drop-input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.drop-icon{flex:0 0 auto;display:flex;color:var(--primary)}
.drop-icon.icon-set{display:none}
.drop-text{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.drop-title{font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop-sub{font-size:12px;color:#7A768C}
.drop-state{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;background:#EEEAF8;color:#6E6A82}
.drop.is-set{border-style:solid;border-color:#3FA46A;background:#EFFAF3}
.drop.is-set .icon-empty{display:none}.drop.is-set .icon-set{display:flex;color:#1F8A4C}
.drop.is-set .drop-title{color:#14532D}
.drop.is-set .drop-state{background:#1F8A4C;color:#fff}
/* 作業ステップ(縦並び) */
.vsteps{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column}
.vsteps li{position:relative;display:flex;align-items:center;gap:14px;padding:12px 4px 12px 0}
.vsteps li:not(:last-child)::after{content:"";position:absolute;left:17px;top:48px;bottom:-12px;width:2px;background:#E5DDFF}
.vsteps li.done:not(:last-child)::after{background:#A7DDBC}
.vsteps .num{flex:0 0 36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:#EEEAF8;color:#6E6A82;position:relative;z-index:1}
.vsteps li.done .num{background:#1F8A4C;color:#fff}
.vsteps li.current .num{background:var(--grad);color:#fff;box-shadow:0 0 0 5px #EDE8FF}
.vs-body{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.vs-body b{font-size:14px}.vs-body span{font-size:12.5px;color:#6E6A82}
.vsteps li.current .vs-body b{color:var(--primary-d)}
.vs-state{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:#EEEAF8;color:#6E6A82}
.vsteps li.done .vs-state{background:var(--ok-bg);color:var(--ok)}
.vsteps li.current .vs-state{background:#EDE8FF;color:var(--primary-d)}
/* 合計カード(売上額・受領額・差額) */
.tcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{background:#fff;border:1px solid #E6E1F5;border-radius:6px;padding:14px 22px 12px;display:flex;flex-direction:column;gap:6px}
.tcard .k{font-size:14px;color:#3A3650}
.tcard .v{font-size:30px;font-weight:700;color:#25233A;font-variant-numeric:tabular-nums;padding:4px 0}
.tcard .d{font-size:12.5px;color:#6E6A82}
.tcard.is-diff{background:#FDEDED;border-color:#F4C7C7}.tcard.is-diff .k,.tcard.is-diff .v,.tcard.is-diff .d,.tcard.is-diff a{color:#B42318}
.tcard.is-ok{background:#EFFAF3;border-color:#BFE3CC}.tcard.is-ok .k,.tcard.is-ok .v,.tcard.is-ok .d{color:#1B6236}
@media (max-width:900px){.tcards{grid-template-columns:1fr}}
.tbl.compact th.n{line-height:1.3}

</style>
</head>
<body>
<div class="app">
<aside class="side">
  <a class="brand" href="#/">受領照合</a>
  <nav class="nav" aria-label="メインメニュー">
    <div class="grp">照合業務</div>
    <a href="#/" data-nav="list">ホーム</a>
    <a href="#/new" data-nav="new">新規照合</a>
    <a href="#/matches" data-nav="matches">照合一覧</a>
    <div class="grp">マスタ</div>
    <a href="#/ledger" data-nav="ledger">販売台帳</a>
    <a href="#/layouts" data-nav="layouts">受領レイアウト・割当</a>
    <div class="grp">データ管理</div>
    <a href="#/backup" data-nav="backup">バックアップ・復元</a>
  </nav>
  <div class="side-foot"><span class="lock">ローカル専用</span> <span class="lock">外部通信なし</span><br>データ保存先:このPCのブラウザ内<br>版 2026.11.27</div>
</aside>
<main class="main" id="view"><div class="sub">読み込んでいます…</div></main>
</div>
<div id="busy" class="busy" hidden><div class="busy-box"><div class="spinner" aria-hidden="true"></div><div id="busy-text">処理しています…</div></div></div>
<noscript><p>JavaScript を有効にしてください。</p></noscript>
<script>

/* 保存(このPCのブラウザ内 IndexedDB)。テスト用にメモリ保存も用意。 */
(function (RM) {
  'use strict';
  const STORES = {
    kv: { keyPath: 'k' },                       // 販売台帳・設定など
    layouts: { keyPath: 'id', autoIncrement: true },
    assignments: { keyPath: 'cust' },
    matches: { keyPath: 'id', autoIncrement: true },
    lines: { keyPath: 'id' },                   // 照合ごとの明細 {id, sales, receipt}
    confs: { keyPath: 'id' },                   // 照合ごとの確認状況 {id, items}
  };
  RM.STORE_NAMES = Object.keys(STORES);

  function req(r) { return new Promise((ok, ng) => { r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error); }); }

  class IdbStore {
    static async open(name = 'receipt-matcher') {
      const r = indexedDB.open(name, 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        for (const [n, o] of Object.entries(STORES)) if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, o);
      };
      const s = new IdbStore();
      s.db = await req(r);
      return s;
    }
    tx(store, mode) { return this.db.transaction(store, mode).objectStore(store); }
    get(store, key) { return req(this.tx(store, 'readonly').get(key)); }
    all(store) { return req(this.tx(store, 'readonly').getAll()); }
    put(store, value) { return req(this.tx(store, 'readwrite').put(value)); }
    del(store, key) { return req(this.tx(store, 'readwrite').delete(key)); }
    clear(store) { return req(this.tx(store, 'readwrite').clear()); }
    async estimate() { try { return await navigator.storage.estimate(); } catch (_) { return null; } }
  }

    constructor() { this.m = {}; this.seq = {}; for (const n of Object.keys(STORES)) { this.m[n] = new Map(); this.seq[n] = 0; } }
    static async open() { return new MemStore(); }
    clone(v) { return v === undefined ? v : structuredClone(v); }
    async get(store, key) { return this.clone(this.m[store].get(key)); }
    async all(store) { return [...this.m[store].values()].map(v => this.clone(v)); }
    async put(store, value) {
      const o = STORES[store];
      value = this.clone(value);
      if (o.autoIncrement && (value[o.keyPath] === undefined || value[o.keyPath] === null)) value[o.keyPath] = ++this.seq[store];
      else if (o.autoIncrement) this.seq[store] = Math.max(this.seq[store], value[o.keyPath]);

      return value[o.keyPath];
    }
    async del(store, key) { this.m[store].delete(key); }

      <span class="drop-state">未選択</span>
    </label>
    <button type="button" class="btn btn-s drop-clear" hidden>選択を取り消す</button></div>`;
  function setDropState(inp) {
    const d = inp.closest('.drop'), w = inp.closest('.dropwrap'), f = inp.files && inp.files[0];
    d.classList.toggle('is-set', !!f);
    d.querySelector('.drop-title').textContent = f ? f.name : d.dataset.label;
    d.querySelector('.drop-sub').textContent = f ? `${(f.size / 1024).toLocaleString('en-US', { maximumFractionDigits: 0 })} KB ・ クリックで選び直し` : 'ここにドラッグ&ドロップ、またはクリックして選択';
    d.querySelector('.drop-state').textContent = f ? '✓ セット済み' : '未選択';

  }
  const opt = (v, label, sel) => `<option value="${h(v)}"${sel ? ' selected' : ''}>${h(label)}</option>`;

  async function customers() {
    const m = new Map();
    for (const [c, n] of await RM.ledgerCustomers()) m.set(c, n || '');
    for (const a of await RM.assignments()) if (!m.has(a.cust)) m.set(a.cust, a.cust_name || '');
    for (const x of await RM.listMatches()) if (!m.has(x.cust)) m.set(x.cust, x.cust_name || '');
    return [...m.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1));
  }
  function pager(page, pages, total, href) {
    if (pages <= 1) return '';
    return `<div class="row pager" style="margin-top:8px"><span class="sub">${fAmt(total)}行中 ${fAmt((page - 1) * PAGE_ROWS + 1)}〜${fAmt(Math.min(page * PAGE_ROWS, total))}行目</span><div class="right">
      ${page > 1 ? `<a class="btn btn-s" href="${href(page - 1)}">前へ</a>` : ''}<span>${page} / ${pages}</span>${page < pages ? `<a class="btn btn-s" href="${href(page + 1)}">次へ</a>` : ''}</div></div>`;

    if (!RM.VIEWS[view] && view !== 'warn') view = 'day';
    const onlyDiff = q.get('only_diff') === '1', onlyUnc = q.get('only_unc') === '1', kw = (q.get('q') || '').trim();
    const t = await RM.totals(id), cnt = await RM.counts(id);
    let rows = [], warns = [];
    if (view === 'warn') warns = await RM.warnings(id);
    else {
      rows = await RM.aggregate(id, view);
      if (onlyDiff) rows = rows.filter(r => !r.ok);
      if (onlyUnc) rows = rows.filter(r => !r.ok && !r.checked);
      if (kw) rows = rows.filter(r => r.k1.includes(kw) || r.k2.includes(kw) || r.comment.includes(kw));
    }
    const total = view === 'warn' ? warns.length : rows.length;
    const pages = Math.max(1, Math.ceil(total / PAGE_ROWS));
    const page = Math.min(Math.max(1, +(q.get('page') || 1)), pages);
    rows = rows.slice((page - 1) * PAGE_ROWS, page * PAGE_ROWS);
    warns = warns.slice((page - 1) * PAGE_ROWS, page * PAGE_ROWS);
    const base = '#/match/' + id;
    const href = p => base + qs({ view, only_diff: onlyDiff ? 1 : '', only_unc: onlyUnc ? 1 : '', q: kw, page: p });
    const V = RM.VIEWS[view], ms = RM.measures(view);
    const tabs = Object.entries(RM.VIEWS).map(([k, v]) => `<a class="tab ${view === k ? 'on' : ''}" href="${base + qs({ view: k, only_diff: onlyDiff ? 1 : '', only_unc: onlyUnc ? 1 : '' })}">${v.label} <span class="cnt ${cnt[k] ? 'has' : ''}">${cnt[k]}</span></a>`).join('') +
      `<a class="tab ${view === 'warn' ? 'on' : ''}" href="${base}?view=warn">変換警告 <span class="cnt ${cnt.warn ? 'has' : ''}">${cnt.warn}</span></a>`;
    let body;

      body = `

    <label class="chk">検索 <input type="search" name="q" value="${h(kw)}" class="cin" placeholder="日付・番号・商品・コメント"></label>
    <button type="submit" class="btn btn-s">表示</button>

  </form>
  <div class="inner"><table class="tbl compact">
    <thead><tr>${V.heads.map(x => `<th>${x}</th>`).join('')}

      <th>判定</th><th>確認済</th><th>コメント</th></tr></thead>
    <tbody>${rows.map(r => `<tr class="${r.row_cls} js-conf" data-id="${id}" data-view="${view}" data-key="${h(r.key_str)}">
      <td><a href="${base}/detail${qs({ view, key: r.key_str })}" title="明細を表示">${h(r.cells[0])}</a></td>${r.cells.slice(1).map(c => `<td>${h(c)}</td>`).join('')}
      ${[r.s, r.r].map(tr => ms.map(x => tr ? `<td class="n">${fmtM(x, tr)}</td>` : '<td class="n zero">—</td>').join('')).join('')}
      ${ms.map(x => `<td class="n">${dcell(FMT[x.key], r.d[x.idx])}</td>`).join('')}
      <td><span class="b ${r.badge}" title="${h(r.judge_label)}">${r.judge_short}</span></td>
      <td style="text-align:center"><input type="checkbox" class="js-check" aria-label="確認済み"${r.checked ? ' checked' : ''}></td>

    ${pager(page, pages, total, href)}
    <p class="note" style="margin-top:8px">${V.k1}をクリックすると明細を表示します。確認済み・コメントは入力すると自動で保存されます。差異 = 売上 − 受領。</p></div>`;
    } else {
      body = `<div class="inner" style="padding-top:12px"><table class="tbl compact">

  async function pageLedger(q) {

    const dupMap = RM.ledgerDupKeys(rows), cand = r => dupMap.get(r.cust + '|' + r.store + '|' + r.partner_code).size;
    const dupCount = [...dupMap.values()].filter(s => s.size > 1).length;
    const custs = await RM.ledgerCustomers();
    const cust = q.get('cust') || '', kw = (q.get('q') || '').trim(), dup = q.get('dup') === '1';
    if (cust) rows = rows.filter(r => r.cust === cust);
    if (kw) rows = rows.filter(r => r.partner_code.includes(kw) || r.own_code.includes(kw) || r.own_name.includes(kw));
    if (dup) rows = rows.filter(r => cand(r) > 1);
    rows.sort((a, b) => (a.cust + '|' + a.partner_code + '|' + a.store).localeCompare(b.cust + '|' + b.partner_code + '|' + b.store));
    const per = 100, total = rows.length, pages = Math.max(1, Math.ceil(total / per)), page = Math.min(Math.max(1, +(q.get('page') || 1)), pages);

    <td>${c.role === 'tdate' ? `<select class="fld fld-s" name="fmt_${c.col_no}" aria-label="日付書式">${Object.entries(RM.DATE_FORMATS).map(([k, v]) => opt(k, v, c.date_format === k)).join('')}</select>` : ''}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="note">${all ? '' : '役割を設定していない列は非表示です。別の列に役割を付けるには「すべての列を表示」を押してください。'}販売先コードの役割がない場合は、照合作成時に指定した販売先として扱います。</p></section>
<div class="row"><div class="right"><a href="#/layouts" class="btn">一覧へ戻る</a><button type="submit" class="btn btn-p">保存</button></div></div>
</form>
<section class="card"><h2>3. 変換結果プレビュー(サンプル先頭${pv.length}行)</h2>
  ${pv.length ? `<div class="tblwrap"><table class="tbl"><thead><tr>${usedRoles.map(r => `<th>${r[1]}</th>`).join('')}</tr></thead>
    <tbody>${pv.map(p => `<tr>${usedRoles.map(r => `<td>${h(p[r[0]] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="note">保存後の設定でプレビューします。</p>`
    : '<div class="sub">サンプルのデータ行がありません。下からサンプルファイルを読み込むとプレビューできます。</div>'}
  <form data-form="layout-sample" data-id="${id}" class="row"><div style="flex:1 1 360px">${dropBox('file', '別のサンプルで読み直す(列の構成が変わった場合など)', '.xlsx,.csv,.txt')}</div>
    <button type="submit" class="btn">読み直す</button></form></section>` };
  }

  // ---------------------------------------------------------------- バックアップ
  async function pageBackup() {
    const est = await RM.db.estimate();
    const ms = await RM.listMatches(), meta = await RM.ledgerMeta();
    const last = (await RM.db.get('kv', 'last_backup')) || null;
    return { nav: 'backup', title: 'バックアップ', html: `
${head('バックアップ・復元', 'データはこのPCのブラウザ内に保存されています')}
<div class="msg msg-warn">データはこのPCのブラウザ内に保存されています。ブラウザの「閲覧データの削除」で「Cookieとサイトデータ」を消すと、データも消えます。定期的にバックアップしてください。</div>
<div class="grid2">
  <section class="card"><h2>バックアップ(ファイルに書き出す)</h2>
    <div class="kv"><div>照合</div><div>${ms.length}件</div><div>販売台帳</div><div>${meta ? fAmt(meta.loaded_rows) + '件' : '未取込'}</div>
      <div>使用容量</div><div>${est && est.usage ? (est.usage / 1048576).toFixed(1) + ' MB' : '—'}</div><div>前回のバックアップ</div><div>${last ? dt(last.at) : 'なし'}</div></div>
    <div><button type="button" class="btn btn-p" data-act="backup">バックアップファイルを保存</button></div>
    <p class="note">すべてのデータ(販売台帳・レイアウト・割当・照合・確認状況)を1つのファイルに保存します。ファイルには業務データが含まれるため、社内の決められた場所に保管してください。</p></section>
  <section class="card"><h2>復元(ファイルから読み込む)</h2>
    <form data-form="restore" style="display:flex;flex-direction:column;gap:10px">${dropBox('file', 'バックアップファイル(.json)', '.json')}
      <div><button type="submit" class="btn btn-danger">復元する</button></div></form>
    <p class="note">復元すると、現在のデータはすべてバックアップの内容に置き換わります。別のPCへの移行にも使えます。</p></section>
</div>` };
  }

  // ---------------------------------------------------------------- ルーティング
  async function render() {
    const { path, q } = parseHash();
    let res;
    try {
      let m;
      if (path === '/' || path === '') res = await pageHome();
      else if (path === '/matches') res = await pageList(q);
      else if (path === '/new') res = await pageNew(q);
      else if (path === '/review') res = pageReview();
      else if ((m = /^\/match\/(\d+)$/.exec(path))) res = await pageResult(+m[1], q);
      else if ((m = /^\/match\/(\d+)\/detail$/.exec(path))) res = await pageDetail(+m[1], q);
      else if (path === '/ledger') res = await pageLedger(q);
      else if (path === '/layouts') res = await pageLayouts();
      else if ((m = /^\/layout\/(\d+)$/.exec(path))) res = await pageLayoutEdit(+m[1], q);
      else if (path === '/backup') res = await pageBackup();
      else res = { redirect: '/' };
    } catch (e) {
      console.error(e);
      res = { nav: '', title: 'エラー', html: `<div class="msg msg-err">画面を表示できませんでした:${h(e.message)}</div><div><a href="#/" class="btn">照合一覧へ</a></div>` };
    }
    if (res.redirect) { if (res.flash) flash = res.flash; location.hash = res.redirect; return; }
    document.title = res.title + ' - 受領照合';
    document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.dataset.nav === res.nav));
    const f = flash; flash = null;
    $('#view').innerHTML = (f && f.msg ? `<div class="msg msg-ok" role="status">${h(f.msg)}</div>` : '') + (f && f.err ? `<div class="msg msg-err" role="alert">${h(f.err)}</div>` : '') + res.html;
    window.scrollTo(0, 0);
    syncFileType();
  }

  function syncFileType() {
    document.querySelectorAll('form').forEach(f => {
      const ft = f.querySelector('select[name=file_type]');
      if (!ft) return;
      f.querySelectorAll('.js-csv').forEach(el => { el.style.display = ft.value === 'csv' ? '' : 'none'; });
      f.querySelectorAll('.js-excel').forEach(el => { el.style.display = ft.value === 'excel' ? '' : 'none'; });
    });
  }

  // ---------------------------------------------------------------- 操作
  // エラーは画面上部に表示するだけにし、入力中の内容(選んだファイル等)は残す
  function showError(msg) {
    const v = $('#view');
    v.querySelectorAll(':scope > .msg').forEach(e => e.remove());
    const d = document.createElement('div');
    d.className = 'msg msg-err'; d.setAttribute('role', 'alert'); d.textContent = msg;
    v.prepend(d);
    window.scrollTo(0, 0);
  }
  async function guarded(fn) {
    try { await fn(); } catch (e) {
      busy(false);
      if (!(e instanceof RM.ReadError)) console.error(e);
      showError(e instanceof RM.ReadError ? e.message : '処理できませんでした:' + e.message);
    }
  }
  const layoutSettings = fd => ({ name: String(fd.get('name') || ''), file_type: String(fd.get('file_type')), encoding: String(fd.get('encoding')),
    delimiter: String(fd.get('delimiter')), sheet_name: String(fd.get('sheet_name') || ''), header_row: parseInt(fd.get('header_row'), 10), data_start_row: parseInt(fd.get('data_start_row'), 10) });

  const FORMS = {
    'list-filter': async (f, fd) => go('/matches' + qs({ cust: fd.get('cust'), from: fd.get('from'), to: fd.get('to'), unchecked: fd.get('unchecked') })),
    'ledger-filter': async (f, fd) => go('/ledger' + qs({ cust: fd.get('cust'), q: fd.get('q'), dup: fd.get('dup') })),
    'result-filter': async (f, fd) => go(f.dataset.base.slice(1) + qs({ view: f.dataset.view, only_diff: fd.get('only_diff'), only_unc: fd.get('only_unc'), q: fd.get('q') })),
    'new': async (f, fd) => {
      let df, dtt;
      try { df = RM.date(String(fd.get('from')).trim()); dtt = RM.date(String(fd.get('to')).trim()); } catch (_) { throw new RM.ReadError('期間を YYYY/MM/DD で入力してください。'); }
      const parentId = fd.get('parent') ? +fd.get('parent') : null;
      const parent = parentId ? await RM.getMatch(parentId) : null;
      const s = await readFile(f.querySelector('input[name=sales]')), r = await readFile(f.querySelector('input[name=receipt]'));
      if (!s || !r) throw new RM.ReadError('売上データと受領データの両方を選択してください。');
      busy(true, 'ファイルを読み込んでいます…');
      draft = await RM.stage({ dateFrom: df, dateTo: dtt, salesName: s.name, salesBuf: s.buf,
        receiptName: r.name, receiptBuf: r.buf, parentId, onProgress: t => busy(true, t) });
      busy(false);
      go('/review');
    },
    'ledger': async f => {
      const file = await readFile(f.querySelector('input[name=file]'));
      if (!file) throw new RM.ReadError('ファイルを選択してください。');
      if (!confirm('現在の販売台帳をすべて置き換えます。よろしいですか?')) return;
      busy(true, '販売台帳を読み込んでいます…');
      const m = await RM.importLedger(file.buf, file.name, n => busy(true, `販売台帳を読み込んでいます…(${n.toLocaleString()}行)`));
      busy(false);
      go('/ledger', { msg: `販売台帳を取り込みました(有効 ${fAmt(m.loaded_rows)}件、削除区分9 を除外 ${fAmt(m.deleted_rows)}件${m.skipped_rows ? `、コード空欄で除外 ${fAmt(m.skipped_rows)}件` : ''})。` });
    },
    'layout-new': async (f, fd) => {
      const st = layoutSettings(fd), file = await readFile(f.querySelector('input[name=file]'));
      if (!file || !st.name.trim()) throw new RM.ReadError('レイアウト名とサンプルファイルを指定してください。');
      if (!(st.header_row >= 1) || !(st.data_start_row > st.header_row)) throw new RM.ReadError('データ開始行は見出し行より後ろにしてください。');
      st.name = st.name.trim(); st.sheet_name = st.sheet_name.trim();
      const id = await RM.createLayoutFromSample(st, file.name, file.buf);
      go('/layout/' + id, { msg: 'サンプルを読み込みました。各列の役割を設定して保存してください。' });
    },
    'layout-save': async (f, fd) => {
      const id = +f.dataset.id, roles = {}, fmts = {};
      for (const [k, v] of fd.entries()) {
        let m;
        if ((m = /^role_(\d+)$/.exec(k))) roles[+m[1]] = RM.ROLE_LABEL[v] ? String(v) : '';
        if ((m = /^fmt_(\d+)$/.exec(k))) fmts[+m[1]] = String(v);
      }
      const errs = await RM.saveLayout(id, layoutSettings(fd), roles, fmts);
      if (errs.length) flash = { err: errs.join(' / ') }; else flash = { msg: '保存しました。' };
      render();
    },
    'layout-sample': async f => {
      const file = await readFile(f.querySelector('input[name=file]'));
      if (!file) throw new RM.ReadError('ファイルを選択してください。');
      await RM.reloadSample(+f.dataset.id, file.name, file.buf);
      flash = { msg: 'サンプルを読み直しました(同じ列・見出しの役割は引き継いでいます)。' };
      render();
    },
    'assign': async (f, fd) => {
      const cust = code(fd.get('cust'));
      if (!cust) throw new RM.ReadError('販売先コードを入力してください。');
      await RM.assign(cust, String(fd.get('cust_name') || ''), +fd.get('layout_id'));
      flash = { msg: `販売先 ${cust} のレイアウトを設定しました。` };
      render();
    },
    'detail-confirm': async (f, fd) => {
      await RM.setConfirmation(+f.dataset.id, f.dataset.view, f.dataset.key, fd.get('checked') === '1', String(fd.get('comment') || ''));
      flash = { msg: '保存しました。' };
      render();
    },
    'restore': async f => {
      const file = f.querySelector('input[name=file]').files[0];
      if (!file) throw new RM.ReadError('ファイルを選択してください。');
      if (!confirm('現在のデータをすべてバックアップの内容に置き換えます。よろしいですか?')) return;
      busy(true, '復元しています…');
      const at = await RM.importBackup(await file.text());
      busy(false);
      go('/', { msg: `復元しました(バックアップ作成日時 ${(at || '').replace(/-/g, '/')})。` });
    },
  };

  const ACTS = {
    'report': async el => {
      const id = +el.dataset.id, m = await RM.getMatch(id);
      const ok = await saveFile(RM.reportFileName(m), 'xlsx', async () => { busy(true, 'Excelレポートを作成しています…'); return RM.buildReport(id); });
      busy(false);
      if (ok) { flash = { msg: 'Excelレポートを保存しました。' }; render(); }
    },
    'delete-match': async el => { if (confirm('この照合を削除します。よろしいですか?')) { await RM.deleteMatch(+el.dataset.id); flash = { msg: '照合を削除しました。' }; render(); } },
    'review-cancel': async () => { const p = draft && draft.parent_id; draft = null; go(p ? '/match/' + p : '/matches', { msg: '取込を中止しました。' }); },
    'review-confirm': async () => {
      if (!draft) return go('/new');
      busy(true, '照合しています…');
      const id = await RM.confirm(draft);
      draft = null;
      busy(false);
      go('/match/' + id, { msg: '照合しました。' });
    },
    'layout-standard': async el => { if (confirm(`「${el.dataset.name}」を標準レイアウトにします。割当のない得意先はこのレイアウトで読み込みます。`)) { await RM.setStandard(+el.dataset.id); flash = { msg: '標準レイアウトを変更しました。' }; render(); } },
    'layout-delete': async el => {
      if (!confirm(`「${el.dataset.name}」を削除します。よろしいですか?`)) return;
      const e = await RM.deleteLayout(+el.dataset.id);
      flash = e ? { err: e } : { msg: 'レイアウトを削除しました。' };
      render();
    },
    'unassign': async el => { if (confirm(`販売先 ${el.dataset.cust} の割当を解除します。`)) { await RM.unassign(el.dataset.cust); flash = { msg: `販売先 ${el.dataset.cust} の割当を解除しました(標準レイアウトを使用します)。` }; render(); } },
    'backup': async () => {
      const d = new Date(), p = n => String(n).padStart(2, '0');
      const name = `受領照合_バックアップ_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`;
      const ok = await saveFile(name, 'json', async () => { busy(true, 'バックアップを作成しています…'); return RM.exportBackup(); });
      busy(false);
      if (!ok) return;
      await RM.db.put('kv', { k: 'last_backup', at: RM.now() });
      flash = { msg: 'バックアップを保存しました。' };
      render();
    },
  };

  async function saveRow(tr) {
    const cb = tr.querySelector('.js-check'), cm = tr.querySelector('.js-comment');
    try {
      await RM.setConfirmation(+tr.dataset.id, tr.dataset.view, tr.dataset.key, cb.checked, cm.value);
      cm.classList.remove('err'); cm.classList.add('saved'); setTimeout(() => cm.classList.remove('saved'), 1200);
    } catch (e) { cm.classList.add('err'); alert('保存できませんでした:' + e.message); }
  }

  function bind() {
    document.addEventListener('submit', e => {
      const f = e.target.closest('form[data-form]');
      if (!f) return;
      e.preventDefault();
      const fn = FORMS[f.dataset.form];
      if (fn) guarded(() => fn(f, new FormData(f)));
    });
    document.addEventListener('click', e => {
      const clr = e.target.closest('.drop-clear');
      if (clr) { const inp = clr.closest('.dropwrap').querySelector('input[type=file]'); inp.value = ''; setDropState(inp); return; }
      const el = e.target.closest('[data-act]');
      if (el && ACTS[el.dataset.act]) { e.preventDefault(); guarded(() => ACTS[el.dataset.act](el)); }
    });
    document.addEventListener('change', e => {
      const t = e.target;
      if (t.matches('.js-check') || t.matches('.js-comment')) { const tr = t.closest('tr.js-conf'); if (tr) saveRow(tr); }
      if (t.matches('.js-autosubmit')) t.form.requestSubmit();
      if (t.matches('select[name=file_type]')) syncFileType();
      if (t.matches('.drop input[type=file]')) setDropState(t);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.js-comment')) { e.preventDefault(); e.target.blur(); } });
    ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest('.drop'); if (d) { e.preventDefault(); d.classList.add('over'); } }));
    ['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest('.drop'); if (d) { e.preventDefault(); d.classList.remove('over'); } }));
    document.addEventListener('drop', e => {
      const d = e.target.closest && e.target.closest('.drop');
      if (!d) { e.preventDefault(); return; }  // 枠の外にファイルを落としてもブラウザでファイルを開かない
      const inp = d.querySelector('input[type=file]');
      if (e.dataTransfer.files.length) { inp.files = e.dataTransfer.files; inp.dispatchEvent(new Event('change', { bubbles: true })); }
    });
    document.addEventListener('dragover', e => e.preventDefault());
    window.addEventListener('hashchange', render);
  }

  async function start() {
    if (!window.indexedDB || !window.DecompressionStream || !window.CompressionStream || !window.TextDecoderStream) {
      $('#view').innerHTML = '<div class="msg msg-err">このブラウザでは動作しません。Microsoft Edge または Google Chrome の最新版で開いてください。</div>';
      return;
    }
    try {
      RM.db = await RM.IdbStore.open();
    } catch (e) {
      $('#view').innerHTML = `<div class="msg msg-err">ブラウザにデータを保存できません(${h(e.message)})。InPrivate / シークレットウィンドウでは使えません。通常のウィンドウで開いてください。</div>`;
      return;
    }
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (_) { /* noop */ }
    await RM.seed();
    bind();
    render();
  }
  document.addEventListener('DOMContentLoaded', start);
})(globalThis.RM = globalThis.RM || {});

</script>
</body>
</html>
